<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>NEON DODGE — Mobile</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root {
      --bg1:#060816; --bg2:#090b20;
      --neon:#36f6ff; --neon2:#ff3df2; --good:#74ff6b; --bad:#ff4d4d;
      --text:#e9eeff; --muted:#9aa7d6; --accent:#36f6ff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: radial-gradient(1200px 800px at 50% 0%, #11164a 0%, var(--bg1) 55%, #03040c 100%); color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif; }
    body.theme-sunset { --bg1:#1a0b14; --bg2:#2d1023; --neon:#ff9a3d; --neon2:#ff4fd8; --accent:#ff9a3d; }
    body.theme-matrix { --bg1:#021006; --bg2:#04170b; --neon:#5cff7a; --neon2:#1ee6a8; --accent:#5cff7a; }
    #wrap { min-height: 100%; display: grid; place-items: center; padding: 8px; }
    #game {
      width: min(94vw, 560px);
      aspect-ratio: 9 / 16;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 25px 90px rgba(0,0,0,0.55);
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .hud {
      position: absolute; inset: 0;
      pointer-events: none;
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    .top { display:flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .score { font-weight: 800; letter-spacing: 0.5px; font-size: 18px; }
    .meta, .submeta { font-size: 12px; color: var(--muted); }
    .center { display:grid; place-items:center; text-align:center; }
    .title { font-size: 20px; font-weight: 900; letter-spacing: 0.8px; }
    .subtitle { margin-top: 6px; font-size: 13px; color: var(--muted); line-height: 1.35; }
    .credit { margin-top: 10px; font-size: 11px; color: var(--muted); opacity: 0.9; }
    .credit a { color: var(--accent); text-decoration: none; }
    .btnRow, .controlRow { display:flex; gap:10px; justify-content:center; flex-wrap: wrap; margin-top: 14px; pointer-events: auto; }
    button, select, input[type="range"] {
      appearance: none; border: 0; border-radius: 12px; padding: 12px 14px;
      font-weight: 800; letter-spacing: 0.3px;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.10) inset;
    }
    select { padding-right: 28px; }
    button.primary {
      background: linear-gradient(90deg, rgba(54,246,255,0.25), rgba(255,61,242,0.18));
      box-shadow: 0 0 0 1px rgba(54,246,255,0.35) inset, 0 0 22px rgba(54,246,255,0.18);
    }
    .controlGroup {
      display:flex; align-items:center; gap:8px; padding: 10px 12px; border-radius: 12px;
      background: rgba(255,255,255,0.06); box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset; pointer-events:auto;
    }
    .controlGroup label { font-size: 12px; color: var(--muted); font-weight: 700; }
    input[type="range"] { padding: 0; width: 120px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 999px; }
    .bottom { display:flex; justify-content: space-between; align-items:flex-end; gap:10px; }
    .hint { font-size: 12px; color: var(--muted); max-width: 65%; }
    .pill {
      font-size: 12px; padding: 6px 10px; border-radius: 999px;
      background: rgba(255,255,255,0.06);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset;
    }
    .comboPop {
      position:absolute; left:50%; top:22%; transform:translateX(-50%);
      font-weight:900; font-size:20px; letter-spacing:0.5px; color:var(--accent);
      text-shadow:0 0 18px rgba(54,246,255,0.55);
      opacity:0; transition:opacity .15s ease, transform .15s ease; pointer-events:none;
    }
    .comboPop.show { opacity:1; transform:translateX(-50%) translateY(-8px); }
    .flash {
      position:absolute; inset:-2px;
      background: radial-gradient(800px 500px at 50% 30%, rgba(54,246,255,0.25), transparent 55%),
                  radial-gradient(700px 450px at 50% 70%, rgba(255,61,242,0.18), transparent 60%);
      opacity: 0;
      transition: opacity 120ms ease;
      pointer-events:none;
      mix-blend-mode: screen;
    }
    .shake { animation: shake 220ms linear; }
    @keyframes shake {
      0%{ transform: translate(0,0) } 20%{ transform: translate(-4px,2px) }
      40%{ transform: translate(3px,-2px) } 60%{ transform: translate(-2px,-1px) }
      80%{ transform: translate(3px,2px) } 100%{ transform: translate(0,0) }
    }
  </style>
</head>
<body class="theme-neon">
<div id="wrap">
  <div id="game" aria-label="NEON DODGE">
    <div class="flash" id="flash"></div>
    <div class="comboPop" id="comboPop">PERFECT +3</div>
    <canvas id="c"></canvas>

    <div class="hud">
      <div class="top">
        <div>
          <div class="score" id="score">SCORE 0</div>
          <div class="meta" id="meta">BEST 0 • Lv 1 • Combo 0</div>
          <div class="submeta" id="rankMeta">RANKING #1 0 / #2 0 / #3 0</div>
        </div>
        <div class="pill" id="statePill">READY</div>
      </div>

      <div class="center" id="overlay">
        <div>
          <div class="title">NEON DODGE+</div>
          <div class="subtitle" id="overlaySubtitle">
            탭하면 다음 레인으로 이동해요.<br/>
            퍼펙트 회피와 콤보로 점수를 폭발시키세요.
          </div>
          <div class="btnRow">
            <button class="primary" id="startBtn">START</button>
            <button id="muteBtn">SOUND: ON</button>
            <button id="installBtn" hidden>INSTALL</button>
          </div>
          <div class="controlRow">
            <div class="controlGroup">
              <label for="volumeSlider">BGM</label>
              <input id="volumeSlider" type="range" min="0" max="100" value="16" />
            </div>
            <div class="controlGroup">
              <label for="laneSelect">LANES</label>
              <select id="laneSelect">
                <option value="2">2</option>
                <option value="3" selected>3</option>
                <option value="4">4</option>
              </select>
            </div>
            <div class="controlGroup">
              <label for="themeSelect">THEME</label>
              <select id="themeSelect">
                <option value="neon" selected>NEON</option>
                <option value="sunset">SUNSET</option>
                <option value="matrix">MATRIX</option>
              </select>
            </div>
          </div>
          <div class="subtitle" style="margin-top:10px">
            리듬 패턴으로 내려오는 장애물을 레인 체인지로 피하세요.<br/>
            퍼펙트 회피 시 점수 + 콤보 + 햅틱!
          </div>
          <div class="credit">
            BGM: <a href="https://pixabay.com/music/synthwave-neon-154762/" target="_blank" rel="noreferrer">Neon - ToniSound (Pixabay)</a>
          </div>
        </div>
      </div>

      <div class="bottom">
        <div class="hint" id="hint">Tap anywhere to move to the next lane • Perfect dodge for combo</div>
        <div class="pill" id="fps">60 FPS</div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: true });
  const gameEl = document.getElementById('game');
  const overlay = document.getElementById('overlay');
  const flash = document.getElementById('flash');
  const comboPop = document.getElementById('comboPop');
  const scoreEl = document.getElementById('score');
  const metaEl = document.getElementById('meta');
  const rankMeta = document.getElementById('rankMeta');
  const statePill = document.getElementById('statePill');
  const fpsEl = document.getElementById('fps');
  const startBtn = document.getElementById('startBtn');
  const muteBtn = document.getElementById('muteBtn');
  const volumeSlider = document.getElementById('volumeSlider');
  const laneSelect = document.getElementById('laneSelect');
  const themeSelect = document.getElementById('themeSelect');
  const installBtn = document.getElementById('installBtn');
  const overlaySubtitle = document.getElementById('overlaySubtitle');

  const STORAGE = {
    best: 'neon_dodge_best_v2',
    ranks: 'neon_dodge_ranks_v2',
    volume: 'neon_dodge_bgm_volume_v2',
    theme: 'neon_dodge_theme_v1',
    lanes: 'neon_dodge_lanes_v1'
  };

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    canvas.width = Math.floor(rect.width * dpr);
    canvas.height = Math.floor(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  new ResizeObserver(resize).observe(canvas);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));

  let audioOn = true;
  let actx = null;
  let masterGain = null;
  let sfxGain = null;

  function ensureAudio() {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = actx.createGain();
      sfxGain = actx.createGain();
      masterGain.gain.value = 1;
      sfxGain.gain.value = 1.7;
      sfxGain.connect(masterGain).connect(actx.destination);
    }
  }

  function beep(freq=440, dur=0.05, type='sine', gain=0.12) {
    if (!audioOn) return;
    ensureAudio();
    const t0 = actx.currentTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(sfxGain);
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  }

  function chord() {
    beep(660,0.08,'triangle',0.11);
    setTimeout(()=>beep(990,0.09,'triangle',0.09), 30);
  }
  function thud() {
    beep(140,0.12,'sawtooth',0.18);
    setTimeout(()=>beep(90,0.14,'square',0.12), 24);
  }
  function perfectSfx() {
    beep(1180,0.06,'square',0.11);
    setTimeout(()=>beep(1560,0.08,'triangle',0.1), 26);
  }
  function comboSfx() {
    beep(900,0.05,'triangle',0.08);
    setTimeout(()=>beep(1200,0.06,'triangle',0.08), 22);
  }

  const BGM_SRC = './bgm.mp3';
  let bgm = null;
  let bgmEnabled = true;
  let bgmFading = false;
  let bgmVolume = Number(localStorage.getItem(STORAGE.volume) || 0.16);

  function ensureBgm() {
    if (bgm) return bgm;
    bgm = new Audio(BGM_SRC);
    bgm.loop = true;
    bgm.preload = 'auto';
    bgm.volume = bgmVolume;
    bgm.addEventListener('error', () => {
      bgmEnabled = false;
      muteBtn.textContent = 'SOUND: ON (BGM FAIL)';
    });
    return bgm;
  }

  async function tryPlayBgm() {
    if (!bgmEnabled) return;
    const a = ensureBgm();
    if (bgmFading) return;
    a.volume = bgmVolume;
    try { await a.play(); } catch {}
  }

  function pauseBgm() {
    if (!bgm) return;
    try { bgm.pause(); } catch {}
  }

  function fadeOutBgm(ms = 450) {
    if (!bgm || bgm.paused) return;
    const start = bgm.volume;
    const t0 = performance.now();
    bgmFading = true;
    function tick(now) {
      const p = Math.min(1, (now - t0) / ms);
      bgm.volume = start * (1 - p);
      if (p < 1) requestAnimationFrame(tick);
      else {
        bgm.pause();
        bgm.volume = bgmVolume;
        bgmFading = false;
      }
    }
    requestAnimationFrame(tick);
  }

  muteBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    audioOn = !audioOn;
    bgmEnabled = audioOn;
    if (bgmEnabled) {
      muteBtn.textContent = 'SOUND: ON';
      beep(523,0.06,'triangle',0.08);
      await tryPlayBgm();
    } else {
      muteBtn.textContent = 'SOUND: OFF';
      pauseBgm();
    }
  });

  volumeSlider.value = Math.round(bgmVolume * 100);
  volumeSlider.addEventListener('input', () => {
    bgmVolume = Number(volumeSlider.value) / 100;
    localStorage.setItem(STORAGE.volume, String(bgmVolume));
    if (bgm) bgm.volume = bgmVolume;
  });

  let lanes = Number(localStorage.getItem(STORAGE.lanes) || 3);
  laneSelect.value = String(lanes);
  laneSelect.addEventListener('change', () => {
    lanes = Number(laneSelect.value);
    localStorage.setItem(STORAGE.lanes, String(lanes));
    reset();
  });

  let theme = localStorage.getItem(STORAGE.theme) || 'neon';
  function getThemeColors() {
    const style = getComputedStyle(document.body);
    return {
      neon: style.getPropertyValue('--neon').trim() || '#36f6ff',
      neon2: style.getPropertyValue('--neon2').trim() || '#ff3df2',
      accent: style.getPropertyValue('--accent').trim() || '#36f6ff'
    };
  }
  function applyTheme(value) {
    theme = value;
    document.body.className = `theme-${value}`;
    localStorage.setItem(STORAGE.theme, value);
  }
  themeSelect.value = theme;
  applyTheme(theme);
  themeSelect.addEventListener('change', () => applyTheme(themeSelect.value));

  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  const laneX = (w, laneCount, lane) => {
    const left = 0.2;
    const right = 0.8;
    if (laneCount <= 1) return w * 0.5;
    return w * (left + ((right - left) / (laneCount - 1)) * lane);
  };

  const bestKey = STORAGE.best;
  let best = Number(localStorage.getItem(bestKey) || 0);
  let ranking = JSON.parse(localStorage.getItem(STORAGE.ranks) || '[0,0,0]').slice(0,3);
  while (ranking.length < 3) ranking.push(0);

  let running = false;
  let gameOver = false;
  let t = 0;
  let last = performance.now();
  let fpsS = {acc:0, n:0, v:60};
  let score = 0;
  let level = 1;
  let combo = 0;
  let maxCombo = 0;
  let perfectCount = 0;
  let beatIndex = 0;
  let spawnTimer = 0;

  const player = { lane: 1, y: 0, r: 11, pulse: 0, switchedAt: -999 };
  const obs = [];
  const parts = [];

  function spawnBurst(x,y, clr, count = 18) {
    for (let i=0;i<count;i++){
      const a = Math.random()*Math.PI*2;
      const sp = 60 + Math.random()*180;
      parts.push({x,y,vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:0.45+Math.random()*0.35, clr, sz:2+Math.random()*3});
    }
  }

  function vibrate(pattern) {
    if (navigator.vibrate) navigator.vibrate(pattern);
  }

  function showCombo(text) {
    comboPop.textContent = text;
    comboPop.style.color = getThemeColors().accent;
    comboPop.classList.remove('show');
    requestAnimationFrame(() => comboPop.classList.add('show'));
    setTimeout(() => comboPop.classList.remove('show'), 420);
  }

  function updateRanking() {
    ranking.push(score);
    ranking.sort((a,b) => b-a);
    ranking = ranking.slice(0,3);
    localStorage.setItem(STORAGE.ranks, JSON.stringify(ranking));
    rankMeta.textContent = `RANKING #1 ${ranking[0]||0} / #2 ${ranking[1]||0} / #3 ${ranking[2]||0}`;
  }

  function updateHUD() {
    scoreEl.textContent = `SCORE ${score}`;
    metaEl.textContent = `BEST ${best} • Lv ${level} • Combo ${combo}`;
    rankMeta.textContent = `RANKING #1 ${ranking[0]||0} / #2 ${ranking[1]||0} / #3 ${ranking[2]||0}`;
  }

  function makePattern() {
    const basePatterns = {
      2: [[0],[1],[0,1],[1],[0],[0,1],[1]],
      3: [[1],[0,2],[2],[0],[1],[0,1],[1,2],[2],[0,2]],
      4: [[1,2],[0,3],[2],[1],[0,2],[1,3],[0],[3],[1,2]]
    };
    return basePatterns[lanes] || basePatterns[3];
  }

  function reset() {
    running = false; gameOver = false;
    score = 0; level = 1; combo = 0; maxCombo = 0; perfectCount = 0; beatIndex = 0;
    t = 0;
    obs.length = 0;
    parts.length = 0;
    spawnTimer = 0;
    player.lane = Math.min(Math.floor(lanes / 2), lanes - 1);
    player.pulse = 0;
    player.switchedAt = -999;
    updateHUD();
    statePill.textContent = 'READY';
    overlay.style.display = 'grid';
    gameEl.classList.remove('shake');
    overlay.querySelector('.title').textContent = '오리지날LEE NEON DODGE+';
    overlaySubtitle.innerHTML = `탭하면 다음 레인으로 이동해요.<br/>${lanes}레인 / ${theme.toUpperCase()} 테마 / 퍼펙트 회피 콤보 가능`;
    startBtn.textContent = 'START';
    pauseBgm();
  }

  async function start() {
    ensureAudio();
    if (actx && actx.state === 'suspended') await actx.resume();
    running = true; gameOver = false;
    overlay.style.display = 'none';
    statePill.textContent = 'LIVE';
    chord();
    await tryPlayBgm();
  }

  function end() {
    running = false;
    gameOver = true;
    statePill.textContent = 'GAME OVER';
    thud();
    fadeOutBgm(520);
    vibrate([90, 40, 90]);
    flash.style.opacity = '0.65';
    setTimeout(()=>flash.style.opacity='0', 120);
    gameEl.classList.add('shake');
    setTimeout(()=>gameEl.classList.remove('shake'), 240);

    best = Math.max(best, score);
    localStorage.setItem(bestKey, String(best));
    updateRanking();

    overlay.querySelector('.title').textContent = 'GAME OVER';
    overlaySubtitle.innerHTML = `SCORE <b>${score}</b> • BEST <b>${best}</b><br/>PERFECT ${perfectCount}회 • Combo 최고 ${maxCombo}`;
    startBtn.textContent = 'RETRY';
    overlay.style.display = 'grid';
  }

  function nextLane() {
    player.lane = (player.lane + 1) % lanes;
    player.pulse = 0.18;
    player.switchedAt = performance.now() / 1000;
    beep(880, 0.07, 'square', 0.12);
    vibrate(10);
  }

  async function input(e) {
    if (e.target.closest('button, select, input')) return;
    ensureAudio();
    if (actx && actx.state === 'suspended') await actx.resume();
    await tryPlayBgm();
    if (!running) await start();
    else nextLane();
  }

  gameEl.addEventListener('pointerdown', input);
  startBtn.addEventListener('click', async (e)=>{ e.stopPropagation(); reset(); await start(); });

  function spawnRhythmObstacle() {
    const pattern = makePattern();
    const beat = pattern[beatIndex % pattern.length];
    beatIndex++;
    const baseSpeed = 240 + level * 16;
    const h = 18 + ((beatIndex % 3) * 8);
    const colors = getThemeColors();
    for (const lane of beat) {
      obs.push({
        id: `${beatIndex}-${lane}-${Math.random()}`,
        lane,
        y: -42,
        h,
        w: 38,
        speed: baseSpeed,
        scored: false,
        perfectAwarded: false,
        glow: lane % 2 === 0 ? colors.neon : colors.neon2,
        fill: lane % 2 === 0 ? 'rgba(54,246,255,0.28)' : 'rgba(255,61,242,0.28)'
      });
    }
  }

  function handlePerfect(o, w) {
    if (o.perfectAwarded) return;
    const px = laneX(w, lanes, player.lane);
    const py = player.y;
    const ox = laneX(w, lanes, o.lane);
    const dx = Math.abs(ox - px);
    const dy = Math.abs(o.y - py);
    const switchedRecently = (performance.now() / 1000) - player.switchedAt < 0.38;
    if (o.lane !== player.lane && switchedRecently && dx < 90 && dy < 44) {
      o.perfectAwarded = true;
      perfectCount++;
      combo++;
      maxCombo = Math.max(maxCombo, combo);
      const bonus = 2 + Math.min(8, combo);
      score += bonus;
      showCombo(`PERFECT +${bonus}`);
      perfectSfx();
      if (combo > 1 && combo % 3 === 0) comboSfx();
      spawnBurst(px, py, getThemeColors().accent, 14);
      vibrate([12, 18, 12]);
      updateHUD();
    }
  }

  function step(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    t += dt;

    fpsS.acc += 1/dt; fpsS.n++;
    if (fpsS.n >= 20) {
      fpsS.v = Math.round(fpsS.acc / fpsS.n);
      fpsS.acc=0; fpsS.n=0;
      fpsEl.textContent = `${fpsS.v} FPS`;
    }

    if (running) {
      level = 1 + Math.floor(score / 20);
      const beatEvery = clamp(0.62 - level * 0.015, 0.34, 0.62);
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnTimer = beatEvery;
        spawnRhythmObstacle();
      }

      const w = canvas.getBoundingClientRect().width;
      const h = canvas.getBoundingClientRect().height;
      player.y = h * 0.83;

      for (let i=obs.length-1;i>=0;i--) {
        const o = obs[i];
        o.y += o.speed * dt;
        handlePerfect(o, w);

        if (!o.scored && o.y > player.y) {
          o.scored = true;
          score += 1;
          if (score % 6 === 0) beep(660,0.07,'triangle',0.08);
          updateHUD();
        }

        if (o.y > h + 80) obs.splice(i,1);
      }

      for (let i=parts.length-1;i>=0;i--) {
        const p = parts[i];
        p.life -= dt;
        p.x += p.vx*dt;
        p.y += p.vy*dt;
        p.vx *= (1 - 2.2*dt);
        p.vy *= (1 - 2.2*dt);
        if (p.life <= 0) parts.splice(i,1);
      }

      let hit = false;
      for (const o of obs) {
        if (o.lane !== player.lane) continue;
        const px = laneX(w, lanes, player.lane);
        const ox = laneX(w, lanes, o.lane);
        const dy = Math.abs(o.y - player.y);
        const dx = Math.abs(ox - px);
        if (dy < (o.h*0.5 + player.r*0.95) && dx < (o.w*0.55)) {
          spawnBurst(px, player.y, '#ff4dff');
          spawnBurst(px, player.y, '#36f6ff');
          combo = 0;
          hit = true;
          break;
        }
      }
      if (hit) end();
      player.pulse = Math.max(0, player.pulse - dt);
    }

    draw();
    requestAnimationFrame(step);
  }

  function draw() {
    const rect = canvas.getBoundingClientRect();
    const W = rect.width, H = rect.height;
    const colors = getThemeColors();
    ctx.clearRect(0,0,W,H);

    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    const grid = 26;
    for (let y=0;y<H;y+=grid){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    for (let x=0;x<W;x+=grid){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    ctx.restore();

    ctx.save();
    ctx.lineWidth = 2;
    ctx.strokeStyle = colors.neon;
    ctx.globalAlpha = 0.28;
    for (let i=0;i<lanes;i++) {
      const x = laneX(W, lanes, i);
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
    }
    ctx.restore();

    for (const o of obs) {
      const x = laneX(W, lanes, o.lane);
      const y = o.y;
      const w = o.w, h = o.h;
      const glow = o.lane % 2 === 0 ? colors.neon : colors.neon2;
      const fill = o.lane % 2 === 0
        ? hexToRgba(colors.neon, 0.30)
        : hexToRgba(colors.neon2, 0.30);
      const core = o.lane % 2 === 0
        ? hexToRgba(colors.neon, 0.95)
        : hexToRgba(colors.neon2, 0.92);

      ctx.save();
      ctx.shadowBlur = 18;
      ctx.shadowColor = glow;
      ctx.fillStyle = fill;
      roundRect(ctx, x - w/2, y - h/2, w, h, 10);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.fillStyle = core;
      roundRect(ctx, x - w/2 + 5, y - h/2 + 4, w-10, h-8, 8);
      ctx.fill();
      ctx.restore();
    }

    const px = laneX(W, lanes, player.lane);
    const py = H*0.83;
    ctx.save();
    const pulse = player.pulse;
    const rr = 12 + pulse*18;
    ctx.shadowBlur = 26;
    ctx.shadowColor = hexToRgba(colors.accent, 0.9);
    ctx.fillStyle = hexToRgba(colors.accent, 0.32);
    ctx.beginPath(); ctx.arc(px, py, rr, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.shadowBlur = 16;
    ctx.shadowColor = hexToRgba(colors.accent, 0.95);
    ctx.fillStyle = hexToRgba(colors.accent, 0.98);
    ctx.beginPath(); ctx.arc(px, py, 11, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    for (const p of parts) {
      ctx.save();
      ctx.globalAlpha = clamp(p.life / 0.8, 0, 1);
      ctx.fillStyle = p.clr;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    ctx.save();
    const g = ctx.createRadialGradient(W/2, H/2, H*0.15, W/2, H/2, H*0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.42)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  function hexToRgba(hex, alpha) {
    if (!hex || !hex.startsWith('#')) return `rgba(255,255,255,${alpha})`;
    let value = hex.replace('#','');
    if (value.length === 3) value = value.split('').map(v => v + v).join('');
    const int = parseInt(value, 16);
    const r = (int >> 16) & 255;
    const g = (int >> 8) & 255;
    const b = int & 255;
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function roundRect(ctx, x, y, w, h, r) {
    const rr = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+rr, y);
    ctx.arcTo(x+w, y,   x+w, y+h, rr);
    ctx.arcTo(x+w, y+h, x,   y+h, rr);
    ctx.arcTo(x,   y+h, x,   y,   rr);
    ctx.arcTo(x,   y,   x+w, y,   rr);
    ctx.closePath();
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) pauseBgm();
    else tryPlayBgm();
  });

  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.hidden = false;
  });
  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.hidden = true;
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }

  updateHUD();
  reset();
  requestAnimationFrame((n)=>{ last=n; requestAnimationFrame(step); });
})();
</script>
</body>
</html>
