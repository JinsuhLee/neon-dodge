<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NEON DODGE — Mobile</title>
  <style>
    :root {
      --bg1:#060816; --bg2:#090b20;
      --neon:#36f6ff; --neon2:#ff3df2; --good:#74ff6b; --bad:#ff4d4d;
      --text:#e9eeff; --muted:#9aa7d6;
    }
    html, body { height: 100%; margin: 0; background: radial-gradient(1200px 800px at 50% 0%, #11164a 0%, var(--bg1) 55%, #03040c 100%); color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif; }
    #wrap { height: 100%; display: grid; place-items: center; }
    #game {
      width: min(92vw, 520px);
      aspect-ratio: 9 / 16;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 25px 90px rgba(0,0,0,0.55);
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .hud {
      position: absolute; inset: 0;
      pointer-events: none;
      padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    .top { display:flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .score { font-weight: 800; letter-spacing: 0.5px; font-size: 18px; }
    .meta { font-size: 12px; color: var(--muted); }
    .center {
      display:grid; place-items:center;
      text-align:center;
    }
    .title { font-size: 18px; font-weight: 800; letter-spacing: 0.6px; }
    .subtitle { margin-top: 6px; font-size: 13px; color: var(--muted); line-height: 1.35; }
    .btnRow { display:flex; gap:10px; justify-content:center; flex-wrap: wrap; margin-top: 14px; pointer-events: auto; }
    button {
      appearance: none; border: 0; border-radius: 12px; padding: 12px 14px;
      font-weight: 800; letter-spacing: 0.3px;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.10) inset;
    }
    button.primary {
      background: linear-gradient(90deg, rgba(54,246,255,0.25), rgba(255,61,242,0.18));
      box-shadow:
        0 0 0 1px rgba(54,246,255,0.35) inset,
        0 0 22px rgba(54,246,255,0.18);
    }
    .bottom { display:flex; justify-content: space-between; align-items:center; gap:10px; }
    .hint { font-size: 12px; color: var(--muted); }
    .pill {
      font-size: 12px; padding: 6px 10px; border-radius: 999px;
      background: rgba(255,255,255,0.06);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset;
    }
    .flash {
      position:absolute; inset:-2px;
      background: radial-gradient(800px 500px at 50% 30%, rgba(54,246,255,0.25), transparent 55%),
                  radial-gradient(700px 450px at 50% 70%, rgba(255,61,242,0.18), transparent 60%);
      opacity: 0;
      transition: opacity 120ms ease;
      pointer-events:none;
      mix-blend-mode: screen;
    }
    .shake { animation: shake 220ms linear; }
    @keyframes shake {
      0%{ transform: translate(0,0) } 20%{ transform: translate(-4px,2px) }
      40%{ transform: translate(3px,-2px) } 60%{ transform: translate(-2px,-1px) }
      80%{ transform: translate(3px,2px) } 100%{ transform: translate(0,0) }
    }
  </style>
</head>
<body>
<div id="wrap">
  <div id="game" aria-label="NEON DODGE">
    <div class="flash" id="flash"></div>
    <canvas id="c"></canvas>

    <div class="hud">
      <div class="top">
        <div>
          <div class="score" id="score">SCORE 0</div>
          <div class="meta" id="meta">BEST 0 • Lv 1</div>
        </div>
        <div class="pill" id="statePill">READY</div>
      </div>

      <div class="center" id="overlay">
        <div>
          <div class="title">NEON DODGE</div>
          <div class="subtitle">
            화면을 <b>탭</b>하면 좌/우 레인 이동<br/>
            장애물을 피하고 “퍼펙트” 타이밍 보너스를 노려요
          </div>
          <div class="btnRow">
            <button class="primary" id="startBtn">START</button>
            <button id="muteBtn">SOUND: ON</button>
          </div>
          <div class="subtitle" style="margin-top:10px">
            팁: 장애물이 플레이어를 스치듯 지나가면 보너스!
          </div>
        </div>
      </div>

      <div class="bottom">
        <div class="hint" id="hint">Tap anywhere to switch lane</div>
        <div class="pill" id="fps">60 FPS</div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: true });
  const gameEl = document.getElementById('game');
  const overlay = document.getElementById('overlay');
  const flash = document.getElementById('flash');

  const scoreEl = document.getElementById('score');
  const metaEl = document.getElementById('meta');
  const statePill = document.getElementById('statePill');
  const fpsEl = document.getElementById('fps');

  const startBtn = document.getElementById('startBtn');
  const muteBtn = document.getElementById('muteBtn');

  // HiDPI resize
  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    canvas.width = Math.floor(rect.width * dpr);
    canvas.height = Math.floor(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  new ResizeObserver(resize).observe(canvas);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));

  // SFX (WebAudio)
  let audioOn = true;
  let actx = null;
  function beep(freq=440, dur=0.05, type='sine', gain=0.06) {
    if (!audioOn) return;
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(actx.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  }
  function chord() { beep(660,0.06,'triangle',0.05); setTimeout(()=>beep(990,0.06,'triangle',0.04), 35); }
  function thud() { beep(140,0.08,'sawtooth',0.07); setTimeout(()=>beep(90,0.10,'sine',0.05), 30); }

  // BGM (local file on GitHub Pages)
  const BGM_SRC = './bgm.mp3';
  let bgm = null;
  let bgmEnabled = true;

  function ensureBgm() {
    if (bgm) return bgm;
    bgm = new Audio(BGM_SRC);
    bgm.loop = true;
    bgm.preload = 'auto';
    bgm.volume = 0.45;
    bgm.addEventListener('error', () => {
      bgmEnabled = false;
      muteBtn.textContent = 'SOUND: ON (BGM FAIL)';
    });
    return bgm;
  }

  async function tryPlayBgm() {
    if (!bgmEnabled) return;
    const a = ensureBgm();
    try {
      await a.play();
    } catch {
      // Mobile autoplay policy: will succeed after a user gesture
    }
  }

  function pauseBgm() {
    if (!bgm) return;
    try { bgm.pause(); } catch {}
  }

  muteBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    audioOn = !audioOn;
    bgmEnabled = audioOn;

    if (bgmEnabled) {
      muteBtn.textContent = 'SOUND: ON';
      beep(523,0.05,'triangle',0.04);
      await tryPlayBgm();
    } else {
      muteBtn.textContent = 'SOUND: OFF';
      pauseBgm();
    }
  });

  const laneX = (w, lane) => (w * (lane === 0 ? 0.35 : 0.65));
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

  const BEST_KEY = 'neon_dodge_best_v1';
  let best = Number(localStorage.getItem(BEST_KEY) || 0);

  let running = false;
  let gameOver = false;

  let t = 0;
  let last = performance.now();
  let fpsS = {acc:0, n:0, v:60};

  let score = 0;
  let level = 1;

  const player = {
    lane: 0,
    y: 0,
    r: 12,
    pulse: 0
  };

  const obs = [];
  let spawnTimer = 0;

  const parts = [];
  function spawnBurst(x,y, clr) {
    for (let i=0;i<18;i++){
      const a = Math.random()*Math.PI*2;
      const sp = 60 + Math.random()*180;
      parts.push({x,y,vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:0.45+Math.random()*0.35, clr, sz:2+Math.random()*3});
    }
  }

  function reset() {
    running = false; gameOver = false;
    score = 0; level = 1;
    t = 0;
    obs.length = 0;
    parts.length = 0;
    spawnTimer = 0;
    player.lane = 0;
    player.pulse = 0;
    updateHUD();
    statePill.textContent = 'READY';
    overlay.style.display = 'grid';
    gameEl.classList.remove('shake');

    overlay.querySelector('.title').textContent = 'NEON DODGE';
    overlay.querySelector('.subtitle').innerHTML =
      `화면을 <b>탭</b>하면 좌/우 레인 이동<br/>\n장애물을 피하고 “퍼펙트” 타이밍 보너스를 노려요`;
    startBtn.textContent = 'START';
  }

  async function start() {
    if (actx && actx.state === 'suspended') actx.resume();
    running = true; gameOver = false;
    overlay.style.display = 'none';
    statePill.textContent = 'LIVE';
    chord();
    await tryPlayBgm();
  }

  function end() {
    running = false;
    gameOver = true;
    statePill.textContent = 'GAME OVER';
    thud();
    flash.style.opacity = '0.65';
    setTimeout(()=>flash.style.opacity='0', 120);
    gameEl.classList.add('shake');
    setTimeout(()=>gameEl.classList.remove('shake'), 240);

    best = Math.max(best, score);
    localStorage.setItem(BEST_KEY, String(best));

    overlay.querySelector('.title').textContent = 'GAME OVER';
    overlay.querySelector('.subtitle').innerHTML =
      `SCORE <b>${score}</b> • BEST <b>${best}</b><br/>탭으로 레인 변경, 장애물 피하기!`;
    startBtn.textContent = 'RETRY';
    overlay.style.display = 'grid';
  }

  function updateHUD() {
    scoreEl.textContent = `SCORE ${score}`;
    metaEl.textContent = `BEST ${best} • Lv ${level}`;
  }

  function toggleLane() {
    if (!running) return;
    player.lane = 1 - player.lane;
    player.pulse = 0.18;
    beep(880, 0.04, 'square', 0.035);
  }

  async function input(e) {
    if (e.target.closest('button')) return;
    await tryPlayBgm();

    if (!running) await start();
    else toggleLane();
  }

  gameEl.addEventListener('pointerdown', input);
  startBtn.addEventListener('click', async (e)=>{ e.stopPropagation(); reset(); await start(); });

  function step(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    t += dt;

    fpsS.acc += 1/dt; fpsS.n++;
    if (fpsS.n >= 20) {
      fpsS.v = Math.round(fpsS.acc / fpsS.n);
      fpsS.acc=0; fpsS.n=0;
      fpsEl.textContent = `${fpsS.v} FPS`;
    }

    if (running) {
      level = 1 + Math.floor(score / 18);
      const baseSpeed = 220 + level * 22;
      const spawnEvery = clamp(0.78 - level*0.03, 0.34, 0.78);

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnTimer = spawnEvery * (0.85 + Math.random()*0.35);
        const lane = Math.random() < 0.5 ? 0 : 1;
        const w = 54;
        const h = 18 + Math.random()*24;
        obs.push({lane, y: -40, h, w, speed: baseSpeed * (0.85 + Math.random()*0.3)});
      }

      const w = canvas.getBoundingClientRect().width;
      const h = canvas.getBoundingClientRect().height;
      player.y = h * 0.83;

      for (let i=obs.length-1;i>=0;i--){
        const o = obs[i];
        o.y += o.speed * dt;

        if (!o.scored && o.y > player.y) {
          o.scored = true;
          score += 1;
          if (score % 6 === 0) beep(660,0.05,'triangle',0.04);
          updateHUD();
        }

        if (o.y > h + 80) obs.splice(i,1);
      }

      for (let i=parts.length-1;i>=0;i--){
        const p = parts[i];
        p.life -= dt;
        p.x += p.vx*dt;
        p.y += p.vy*dt;
        p.vx *= (1 - 2.2*dt);
        p.vy *= (1 - 2.2*dt);
        if (p.life <= 0) parts.splice(i,1);
      }

      for (const o of obs) {
        if (o.lane !== player.lane) continue;
        const px = laneX(w, player.lane);
        const ox = laneX(w, o.lane);
        const dy = Math.abs(o.y - player.y);
        const dx = Math.abs(ox - px);
        if (dy < (o.h*0.5 + player.r*0.9) && dx < (o.w*0.45)) {
          spawnBurst(px, player.y, '#ff4dff');
          spawnBurst(px, player.y, '#36f6ff');
          end();
          break;
        }
      }

      player.pulse = Math.max(0, player.pulse - dt);
    }

    draw();
    requestAnimationFrame(step);
  }

  function draw() {
    const rect = canvas.getBoundingClientRect();
    const W = rect.width, H = rect.height;

    ctx.clearRect(0,0,W,H);

    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    const grid = 26;
    for (let y=0;y<H;y+=grid){
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }
    for (let x=0;x<W;x+=grid){
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
    }
    ctx.restore();

    const x0 = laneX(W,0), x1 = laneX(W,1);
    ctx.save();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(54,246,255,0.18)';
    ctx.beginPath();
    ctx.moveTo(x0, 0); ctx.lineTo(x0, H);
    ctx.moveTo(x1, 0); ctx.lineTo(x1, H);
    ctx.stroke();
    ctx.restore();

    for (const o of obs) {
      const x = laneX(W,o.lane);
      const y = o.y;
      const w = o.w, h = o.h;
      ctx.save();
      ctx.shadowBlur = 18;
      ctx.shadowColor = o.lane===0 ? 'rgba(54,246,255,0.7)' : 'rgba(255,61,242,0.7)';
      ctx.fillStyle = o.lane===0 ? 'rgba(54,246,255,0.35)' : 'rgba(255,61,242,0.30)';
      roundRect(ctx, x - w/2, y - h/2, w, h, 10);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.fillStyle = o.lane===0 ? 'rgba(54,246,255,0.85)' : 'rgba(255,61,242,0.82)';
      roundRect(ctx, x - w/2 + 6, y - h/2 + 5, w-12, h-10, 8);
      ctx.fill();
      ctx.restore();
    }

    const px = laneX(W, player.lane);
    const py = H*0.83;

    ctx.save();
    const pulse = player.pulse;
    const rr = 12 + pulse*18;
    ctx.shadowBlur = 26;
    ctx.shadowColor = 'rgba(116,255,107,0.8)';
    ctx.fillStyle = 'rgba(116,255,107,0.35)';
    ctx.beginPath(); ctx.arc(px, py, rr, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.shadowBlur = 16;
    ctx.shadowColor = 'rgba(116,255,107,0.9)';
    ctx.fillStyle = 'rgba(116,255,107,0.95)';
    ctx.beginPath(); ctx.arc(px, py, 12, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    for (const p of parts) {
      ctx.save();
      ctx.globalAlpha = clamp(p.life / 0.8, 0, 1);
      ctx.fillStyle = p.clr;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    ctx.save();
    const g = ctx.createRadialGradient(W/2, H/2, H*0.15, W/2, H/2, H*0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.42)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  function roundRect(ctx, x, y, w, h, r) {
    const rr = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+rr, y);
    ctx.arcTo(x+w, y,   x+w, y+h, rr);
    ctx.arcTo(x+w, y+h, x,   y+h, rr);
    ctx.arcTo(x,   y+h, x,   y,   rr);
    ctx.arcTo(x,   y,   x+w, y,   rr);
    ctx.closePath();
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) pauseBgm();
    else tryPlayBgm();
  });

  reset();
  requestAnimationFrame((n)=>{ last=n; requestAnimationFrame(step); });

})();
</script>
</body>
</html>
